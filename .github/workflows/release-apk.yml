name: Build APK and publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK and run unit tests
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
          cp app/build/outputs/apk/debug/app-debug.apk TransportGuide-debug.apk

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NOTES="Transport Guide for the Europe 2026 trip. Android 8.0+.
          Install: download TransportGuide-debug.apk on your phone, open it and allow 'Install unknown apps'."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" TransportGuide-debug.apk --clobber
          else
            gh release create "$TAG" TransportGuide-debug.apk \
              --target "$GITHUB_SHA" --title "Transport Guide $TAG" --notes "$NOTES"
          fi
